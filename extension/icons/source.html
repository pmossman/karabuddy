<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KaraBuddy icon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Viewport-relative so the same HTML renders crisply at any size
     (16/48/128/512). The browser does the layout pass at native pixels,
     which avoids the cascade of resamples that come from rendering big
     and then downsampling externally. */
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 100vw; height: 100vh; }
  .icon {
    width: 100vw;
    height: 100vh;
    border-radius: 23.8%; /* launcher 10/42 ≈ 23.8% */
    background: linear-gradient(140deg, #243044 0%, #1a1d23 100%);
    border: 2.4vw solid rgba(77, 157, 255, 0.55); /* launcher 1/42 ≈ 2.4% */
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .mono {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 0.95;
    padding: 0 9.5vw; /* launcher 4/42 ≈ 9.5% */
  }
  .kara {
    font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    font-size: 28.5vw; /* launcher 12/42 ≈ 28.5% */
    color: #ffffff;
    letter-spacing: 0;
    text-transform: uppercase;
  }
  .buddy {
    /* New brand: squared "space-HUD" Orbitron + the cyan→azure gradient, to
       match the app logo. No glow/shadow — keeps small sizes crisp. KARA stays
       Barlow (the KARABAST wordmark match) above. */
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 16vw;
    text-transform: uppercase;
    letter-spacing: 0;
    margin-top: 1vw;
    background: linear-gradient(90deg, #4dd2ff 0%, #4d9dff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
<div class="icon"><div class="mono"><span class="kara">KARA</span><span class="buddy">BUDDY</span></div></div>
</body>
</html>
