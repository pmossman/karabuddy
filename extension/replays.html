<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>KaraBuddy — Replays</title>
        <link rel="stylesheet" href="shared.css" />
        <link rel="stylesheet" href="replays.css" />
    </head>
    <body>
        <header>
            <div class="brand-block">
                <div class="kb-brand">
                    <span class="kb-brand__main">KARA</span>
                    <span class="kb-brand__sub">buddy</span>
                </div>
                <span class="kb-page-label">Replays</span>
            </div>
            <div class="header-meta">
                <span id="count" class="kb-pill">0 replays</span>
                <button id="upload" class="kb-btn" type="button" title="Add a .karareplay file to your library">
                    + Upload replay
                </button>
                <input id="upload-input" type="file" accept=".karareplay,.json,application/json" hidden />
                <input id="filter" type="search" placeholder="Filter by name, leader, base, or date…" />
            </div>
            <div id="upload-status" class="upload-status" hidden></div>
        </header>

        <main>
            <div id="grid" class="grid" hidden></div>
            <div id="empty" class="empty" hidden>
                No saved replays yet. Finished games on karabast.net are saved here automatically.
            </div>
            <div id="empty-filter" class="empty" hidden>
                No replays match the filter.
            </div>
            <div id="loading" class="empty">Loading…</div>
        </main>

        <script src="replays.js"></script>
    </body>
</html>
