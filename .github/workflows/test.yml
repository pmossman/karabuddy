name: test

# PRs run the full suite here. Pushes to main are gated by the `deploy`
# workflow (which runs the same suite before deploying), so main isn't
# double-tested.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  api:
    name: api integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karabuddy_test
          POSTGRES_PASSWORD: karabuddy_test
          POSTGRES_DB: karabuddy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:api

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karabuddy_test
          POSTGRES_PASSWORD: karabuddy_test
          POSTGRES_DB: karabuddy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          POSTGRES_URL: postgres://karabuddy_test:karabuddy_test@localhost:5433/karabuddy_test
          CI: '1'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: playwright-report/
          retention-days: 7
