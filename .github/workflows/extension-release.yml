name: extension-release

# Auto-cut an extension GitHub Release whenever extension code lands on main.
# This builds + versions an ARTIFACT only — it does NOT submit to the Chrome
# Web Store. CWS submission stays a deliberate, batched human step (download
# the Release zip → upload), so tiny pushes never flood the CWS review queue.
# See docs/extension-rollout.md.
#
# Versioning is hybrid:
#   • If extension/manifest.json's version isn't released yet (you bumped it,
#     e.g. a minor/major) → release THAT version as-is.
#   • If it's already released → auto-increment the patch, commit the bump
#     back to main, and release the new patch.
# The bump commit + tag are pushed with GITHUB_TOKEN, which does NOT
# re-trigger workflows — so there's no release loop.

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'lib/commentScope.js'
      - 'scripts/package-extension.sh'
      - '.github/workflows/extension-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write # push the version bump + create the tag/release

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need tags to know what's already been released
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      # Keep the extension's copy of the shared scope rule byte-identical.
      - run: npm run sync:extension-shared

      - name: Resolve the release version (release-as-is, else auto-patch)
        id: ver
        run: |
          CURRENT="$(node -p "require('./extension/manifest.json').version")"
          if git rev-parse -q --verify "refs/tags/ext-v$CURRENT" >/dev/null; then
            # Already released → bump the patch in the manifest.
            NEW="$(node -e '
              const fs = require("fs"), p = "./extension/manifest.json";
              const m = JSON.parse(fs.readFileSync(p, "utf8"));
              const [a, b, c] = m.version.split(".").map(Number);
              m.version = m.version_name = [a, b, (c || 0) + 1].join(".");
              fs.writeFileSync(p, JSON.stringify(m, null, 4) + "\n");
              console.log(m.version);
            ')"
            echo "bumped=1" >> "$GITHUB_OUTPUT"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "version $CURRENT already released → auto-bumped to $NEW"
          else
            echo "bumped=0" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "releasing manifest version $CURRENT as-is (not yet released)"
          fi

      # Extension JS unit tests, incl. commentScope.parity (guards the
      # byte-for-byte shared-file copy in extension/replays/00-comment-scope.js).
      - run: npm run test:unit

      # Syncs shared files (again, no-op) then zips → dist/karabuddy-extension-<version>.zip
      - run: npm run package:extension
      # Firefox/AMO build → dist/karabuddy-extension-firefox-<version>.zip (Gecko
      # manifest variant). Both zips ride in the same Release; CWS submit picks
      # the Chrome one, AMO submit picks the firefox one.
      - run: npm run package:extension:firefox

      - name: Commit version bump / shared-file sync back to main
        run: |
          if [ -n "$(git status --porcelain extension lib/commentScope.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add extension lib/commentScope.js
            git commit -m "chore(ext): release ext-v${{ steps.ver.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Create the GitHub Release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ext-v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" dist/karabuddy-extension-*.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --generate-notes \
            --notes "Automated extension build (Chrome + Firefox zips). NOT yet submitted to any store — promote deliberately via extension-submit-cws (Chrome) / extension-submit-amo (Firefox). See docs/extension-rollout.md."
