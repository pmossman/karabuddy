name: deploy

# Gated production deploy. Push to main → full test suite → build the real
# prod bundle and smoke it locally against the isolated ci-preview Neon
# branch → only on green, deploy a fresh production build (prod env/DB).
#
# CI-local smoke (not a deployed Vercel preview) because preview deploys are
# SSO-protected and the bypass is Pro-only — this still verifies the real
# build + real isolated DB end to end. Vercel's own main auto-deploy is off
# (vercel.json git.deploymentEnabled.main=false), so this is the only path.
#
# Requires repo secrets: VERCEL_TOKEN, CI_PREVIEW_POSTGRES_URL.

on:
  push:
    branches: [main]
    # Skip the full test→smoke→deploy cycle for pushes that can't affect the
    # deployed server. The run is skipped only if EVERY changed file matches
    # one of these. `extension/**` is excluded from the Vercel build (via
    # .vercelignore) and handled by extension-release; `lib/commentScope.js`
    # is deliberately NOT ignored since the web app imports it.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extension/**'
      - 'assets/**' # store/Discord/brand images — uploaded manually, not part of the app build
      - '.claude/**' # editor/agent skills + config — never part of the app build
      - '.github/workflows/extension-release.yml'
      - '.github/workflows/extension-submit-cws.yml'
      - '.github/workflows/extension-submit-amo.yml'

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_zhQXNAyy8XQ6E6Gq2x2LhAAY
  VERCEL_PROJECT_ID: prj_jZXlguFRng6qwsS9JWgqN2gYtXey

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karabuddy_test
          POSTGRES_PASSWORD: karabuddy_test
          POSTGRES_DB: karabuddy_test
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 10
        ports: ['5433:5432']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          POSTGRES_URL: postgres://karabuddy_test:karabuddy_test@localhost:5433/karabuddy_test
          CI: '1'

  smoke-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm i -g vercel@latest
      - run: npx playwright install --with-deps chromium

      # Bring the shared ci-preview branch to the latest schema (prod build's
      # prebuild only migrates production, so do it explicitly here).
      - name: Migrate ci-preview DB
        run: npm run db:migrate
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.CI_PREVIEW_POSTGRES_URL }}

      # Build the real prod bundle once for the local smoke. `next build`
      # directly (not `npm run build`) skips the maybe-migrate prebuild.
      - name: Build prod bundle for smoke
        run: npx next build
        env:
          POSTGRES_URL: ${{ secrets.CI_PREVIEW_POSTGRES_URL }}
          KARABUDDY_BLOB_MODE: memory
          AUTH_SECRET: ci-smoke-secret
          AUTH_URL: http://localhost:3000
          AUTH_DISCORD_ID: unused
          AUTH_DISCORD_SECRET: unused
          AUTH_GOOGLE_ID: unused
          AUTH_GOOGLE_SECRET: unused

      # Smoke the prebuilt prod server against the ci-preview DB. The smoke
      # config boots `next start` (no SMOKE_BASE_URL) inheriting this env.
      - name: Smoke the local prod server (ci-preview DB)
        run: npx playwright test --config playwright.smoke.config.ts
        env:
          POSTGRES_URL: ${{ secrets.CI_PREVIEW_POSTGRES_URL }}
          KARABUDDY_BLOB_MODE: memory
          AUTH_SECRET: ci-smoke-secret
          AUTH_URL: http://localhost:3000
          AUTH_DISCORD_ID: unused
          AUTH_DISCORD_SECRET: unused
          AUTH_GOOGLE_ID: unused
          AUTH_GOOGLE_SECRET: unused

      # Smoke passed → deploy a FRESH production build (Vercel builds remotely
      # with prod env; its prebuild migrates prod). No ci-preview env in scope
      # here, so prod can't pick up the test DB.
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  # B81: report the outcome to the KaraBuddy Discord #ci channel. No-op until
  # the DISCORD_CI_WEBHOOK_URL secret is set, so this is safe to merge now.
  notify:
    needs: [test, smoke-and-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord deploy notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          TEST: ${{ needs.test.result }}
          DEPLOY: ${{ needs.smoke-and-deploy.result }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          SHA="${GITHUB_SHA::7}"
          if [ "$DEPLOY" = "success" ]; then
            MSG="✅ KaraBuddy deployed to prod ($SHA)"
          elif [ "$TEST" != "success" ]; then
            MSG="❌ KaraBuddy CI failed at tests ($SHA) — no deploy"
          else
            MSG="❌ KaraBuddy deploy failed ($SHA)"
          fi
          curl -s -H 'Content-Type: application/json' -d "{\"content\": \"$MSG\"}" "$WEBHOOK" || true
