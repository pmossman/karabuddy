<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .icon {
    width: 1024px; height: 1024px; box-sizing: border-box; border-radius: 200px;
    padding: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background:
      radial-gradient(circle at 50% 32%, rgba(77, 210, 255, 0.22), transparent 58%),
      linear-gradient(150deg, #27384f 0%, #11151c 58%, #0b0e13 100%);
  }
  .kara { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 232px; color: #eef3fb; letter-spacing: 10px; line-height: 0.92; }
  .buddy {
    font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 188px; text-transform: uppercase; letter-spacing: 2px; line-height: 0.92;
    background: linear-gradient(90deg, #4dd2ff 0%, #4d9dff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(77, 210, 255, 0.4));
  }
</style>
</head>
<body><div class="icon"><div class="kara">KARA</div><div class="buddy">BUDDY</div></div></body>
</html>
