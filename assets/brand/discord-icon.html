<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    width: 1024px; height: 1024px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    background:
      radial-gradient(circle at 50% 30%, rgba(77, 210, 255, 0.20), transparent 56%),
      linear-gradient(150deg, #25364f 0%, #11151c 60%, #0b0e13 100%);
  }
  .kara {
    font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 184px;
    color: #eef3fb; letter-spacing: 10px; line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .buddy {
    font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 150px;
    text-transform: uppercase; letter-spacing: 6px; line-height: 1;
    background: linear-gradient(90deg, #4dd2ff 0%, #4d9dff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(77, 210, 255, 0.35));
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="kara">KARA</div>
    <div class="buddy">BUDDY</div>
  </div>
</body>
</html>
